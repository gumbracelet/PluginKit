name: Release

on:
  # The normal path: pick a bump type, everything else is derived. A dispatch is
  # a human saying "release this", so it bypasses the automatic gating below.
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Verify and generate notes, but do not commit, tag or publish"
        required: false
        type: boolean
        default: false

  # The automatic path: a *releasable* change under Sources/ ships a release.
  # Both halves of that matter — see the gate job.
  #
  # `paths` here is only a pre-filter, and it is not load-bearing: GitHub does
  # not apply path filters to tag pushes, and this block deliberately matches
  # tags too. The gate job is the authority on whether a release happens.
  push:
    branches: [master, main]
    paths: ["Sources/**"]
    tags: ["v*"]

permissions:
  contents: read

# Two releases at once would race on tag creation. Never cancel one in flight —
# it may already have pushed a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A separate job, on a cheap runner, so that deciding *not* to release costs
  # seconds on Linux rather than minutes on macOS — which GitHub bills at ten
  # times the rate. Previously the toolchain, version resolution and version
  # stamp all ran on macOS before anything could conclude there was nothing to
  # ship.
  gate:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history: "is anything releasable since the last tag"
          # cannot be answered from a shallow clone.
          fetch-depth: 0

      - name: Decide whether to release
        id: decide
        env:
          # Secrets and inputs are not dependably readable from a step-level
          # `if`, so the event shape is resolved into plain strings here.
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          AUTO: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
          # The branch tip before this push, used to find what it changed.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          decide() {
            echo "proceed=$1" >>"$GITHUB_OUTPUT"
            echo "reason=$2" >>"$GITHUB_OUTPUT"
            echo "$2"
            exit 0
          }

          # A human asked for it, or a tag already exists and says what the
          # version is. Neither is subject to the automatic heuristics.
          #
          # Written as `if` blocks rather than `cond && decide ...`: the latter
          # works only because errexit exempts a failing non-final command in an
          # AND-list, which is too subtle to leave load-bearing in the one place
          # that decides whether a release happens.
          if [ "$DISPATCHED" = "true" ]; then
            decide true "dispatched manually"
          fi
          if [ "$AUTO" != "true" ]; then
            decide true "tag push: ${GITHUB_REF_NAME}"
          fi

          # 1. Did this push touch Sources/ at all?
          #
          # Computed natively rather than with a third-party action. The action
          # this replaces was pinned to a mutable tag and ran in a job that
          # could write to the repository, which is a lot of trust to place in
          # a path comparison git already does.
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # A newly created branch, or a force-push that orphaned the old tip:
            # there is no range to compare, so consider the pushed commit alone.
            changed="$(git show --name-only --format= HEAD)"
          else
            changed="$(git diff --name-only "$BEFORE" HEAD)"
          fi

          if ! printf '%s\n' "$changed" | grep -q '^Sources/'; then
            decide false "no Sources/ change in this push — nothing to release"
          fi

          # 2. Is HEAD our own release commit?
          #
          # The release commit stamps the version constant, so it touches
          # Sources/ and passes the check above. Pushing with the default
          # GITHUB_TOKEN already does not retrigger workflows; this is the guard
          # that survives someone swapping in a PAT.
          subject="$(git log -1 --format='%s')"
          case "$subject" in
            "chore(release): "*)
              decide false "HEAD is the release commit itself — not releasing it again" ;;
          esac

          # 3. Is anything since the last tag actually worth releasing?
          #
          # This is the difference between a semantic release and a
          # path-triggered one. Touching a file under Sources/ is not news; a
          # feat, fix, perf, revert or breaking change is. Without this, a
          # `chore` or `style` commit that happens to live under Sources/ mints
          # a version whose changelog entry reads "_No user-facing changes
          # recorded._" — a version consumers must evaluate, for nothing.
          #
          # Dispatch manually to release anyway; that path skips this entirely.
          if ! Scripts/pluginkit-changelog releasable; then
            decide false "no releasable commits since the last tag — nothing to release"
          fi

          decide true "releasable change under Sources/"

      # A skipped release used to be indistinguishable from one that shipped:
      # both showed a green tick and neither wrote a summary. Saying so plainly
      # is what stops someone cancelling a run because they cannot tell.
      - name: Explain a no-op
        if: steps.decide.outputs.proceed != 'true'
        run: |
          {
            echo "## No release"
            echo
            echo "${{ steps.decide.outputs.reason }}"
            echo
            echo "Run this workflow manually to release anyway:"
            echo "**Actions → Release → Run workflow**."
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    name: Verify, tag, publish
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    # Only this job writes. The gate job above reads.
    permissions:
      contents: write

    env:
      DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
      AUTO: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
      DRY_RUN: ${{ inputs.dry_run == true }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version is computed from the newest tag,
          # and the changelog spans the range since it. A shallow clone would
          # compute a wrong version silently, which is worse than failing.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      # Dispatched: derive the next version from the newest tag and the chosen
      # bump. Auto-pushed: infer the bump from the conventional-commit prefixes
      # since the last tag. Tag-pushed: the tag already says what the version is.
      #
      # Inputs reach the shell through env, never through direct interpolation,
      # so a crafted branch or tag name cannot inject commands here.
      - name: Resolve version
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          if [ "$DISPATCHED" = "true" ]; then
            previous="$(git tag -l 'v*' --sort=-v:refname | awk '!/-/ { print; exit }')"
            version="$(Scripts/pluginkit-changelog next-version "$VERSION_TYPE")"
            echo "Bumping $VERSION_TYPE: ${previous:-none} -> v$version"
          elif [ "$AUTO" = "true" ]; then
            previous="$(git tag -l 'v*' --sort=-v:refname | awk '!/-/ { print; exit }')"
            version="$(Scripts/pluginkit-changelog next-version auto)"
            echo "Auto-releasing from commits since ${previous:-none} -> v$version"
          else
            version="${GITHUB_REF_NAME#v}"
            # The tag under release is already at HEAD, so the changelog range
            # has to start at the tag before it.
            previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"
            echo "Releasing tag $GITHUB_REF_NAME"
          fi

          case "$version" in
            *[!0-9A-Za-z.+-]*|"") echo "refusing implausible version '$version'" >&2; exit 1 ;;
          esac

          if { [ "$DISPATCHED" = "true" ] || [ "$AUTO" = "true" ]; } \
            && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists — nothing to bump into" >&2
            exit 1
          fi

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"

      # `PluginKitVersion.current` is compiled in — a plugin's `sdkVersion` is
      # checked against the constant, not the tag — so the two have to ship as
      # one number. This is what keeps them together.
      #
      # It runs before the build, so the tree that gets tested is the tree that
      # gets tagged. Stamping afterwards would tag a commit whose version
      # constant was never compiled.
      - name: Stamp the package version
        if: env.DISPATCHED == 'true' || env.AUTO == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/pluginkit-version set "$VERSION"

      # The tag-push path writes no commit, so there is nothing to stamp into —
      # the constant must already agree with the tag. Failing here is the whole
      # point: it is the check that would have caught v1.0.0 shipping with the
      # constant still reading 0.1.0.
      - name: Check the package version matches the tag
        if: env.DISPATCHED != 'true' && env.AUTO != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/pluginkit-version check "$VERSION"

      # Everything that can fail runs before the repository is touched, so a
      # broken build never leaves a stray tag or changelog commit behind.
      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release

      # PluginKitCore and PluginKitSDK are the only targets on a binary boundary
      # between a host and a separately-compiled plugin. If either stops
      # compiling under library evolution, a plugin built against one release
      # cannot be loaded by a host linking another, and nothing else in the build
      # would say so. See docs/distribution.md.
      - name: Library evolution (Core + SDK)
        run: |
          swift build -c release --target PluginKitCore \
            -Xswiftc -enable-library-evolution
          swift build -c release --target PluginKitSDK \
            -Xswiftc -enable-library-evolution

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          notes="$RUNNER_TEMP/release/changelog.md"
          if [ -n "$PREVIOUS" ]; then
            Scripts/pluginkit-changelog notes "$VERSION" --since "$PREVIOUS" >"$notes"
          else
            Scripts/pluginkit-changelog notes "$VERSION" >"$notes"
          fi
          echo "path=$notes" >>"$GITHUB_OUTPUT"
          echo "--- generated notes ---"
          cat "$notes"

      # Only the dispatched and auto paths own the version, so only they write
      # CHANGELOG.md and create the tag. A hand-pushed tag already exists, and
      # its changelog entry is the maintainer's to add.
      #
      # Pushing with the default GITHUB_TOKEN deliberately does not retrigger
      # workflows, which is what stops the new tag from starting a second
      # release. Swapping in a PAT here would reintroduce that loop — the gate
      # job's `chore(release):` check is what would still catch it.
      - name: Commit changelog and tag
        if: (env.DISPATCHED == 'true' || env.AUTO == 'true') && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            Scripts/pluginkit-changelog update "$VERSION" --since "$PREVIOUS"
          else
            Scripts/pluginkit-changelog update "$VERSION"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The stamped version constant ships in the same commit as its
          # changelog entry, so the two can never be pushed apart.
          git add CHANGELOG.md Sources/PluginKitCore/Contracts/Plugin.swift
          git commit -m "chore(release): $VERSION [skip ci]"
          # Annotated, never lightweight. The tag ref is `vX.Y.Z`; its message is
          # the one place the package name is spelled out.
          git tag -a "v$VERSION" -m "PluginKit $VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "v$VERSION"

      - name: Publish a GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          body="$RUNNER_TEMP/release/body.md"
          {
            cat "$NOTES"
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```swift'
            echo ".package(url: \"$REPO_URL.git\", from: \"$VERSION\")"
            echo '```'
            echo
            echo "Hosts link \`PluginKitHost\` and a runtime; plugins link \`PluginKitSDK\`."
            echo "See [docs/getting-started.md]($REPO_URL/blob/v$VERSION/docs/getting-started.md)."
          } >"$body"

          # Titled with the bare tag, matching the ref. The package name is
          # already on the page, so repeating it here only makes the release
          # list harder to scan.
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$body"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NOTES: ${{ steps.notes.outputs.path }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run — v$VERSION was verified but nothing was published"
            else
              echo "## Released v$VERSION"
            fi
            echo
            echo "Triggered because: $REASON"
            echo
            echo "Previous release: \`${PREVIOUS:-none}\`"
            echo
            cat "$NOTES"
          } >>"$GITHUB_STEP_SUMMARY"
